name: Extrair e Salvar WebZero

on:
  push:
    branches: [ "principal" ]

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair arquivo zip
        run: unzip -o WebZero.zip -d .

      - name: Enviar arquivos para o repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extraindo arquivos do WebZero.zip automaticamente" || echo "Nenhuma alteração para enviar"
          git push
          
